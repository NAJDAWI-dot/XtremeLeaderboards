.blk>*{position:relative}
header.blk{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.title{background:var(--steel);padding:10px 18px;display:inline-block}
h1{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(26px,5.2vw,56px);letter-spacing:.06em;color:#fff;line-height:1;position:relative;text-shadow:4px 4px 0 var(--deep);white-space:nowrap}
h1 .g{position:absolute;left:0;top:0;text-shadow:none}
h1 .g1{color:#9BE7FF;clip-path:inset(18% 0 58% 0);transform:translateX(-5px);opacity:.9}
h1 .g2{color:#fff;clip-path:inset(64% 0 12% 0);transform:translateX(6px)}
@media (prefers-reduced-motion:no-preference){h1 .g1{animation:gl 4.5s steps(1) infinite}h1 .g2{animation:gl 4.5s steps(1) infinite reverse}}
@keyframes gl{0%,86%,100%{transform:translateX(0)}88%{transform:translateX(-6px)}92%{transform:translateX(5px)}96%{transform:translateX(-3px)}}
.sub{font-family:var(--f-pix);font-size:13px;letter-spacing:.22em;color:var(--steel);margin-top:10px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.dot{width:10px;height:10px;background:var(--live);box-shadow:0 0 8px var(--live);flex:none}
.dot.stale{background:#FFC857;box-shadow:0 0 8px #FFC857}
.stamp{font-family:var(--f-pix);font-size:14px;letter-spacing:.12em;color:var(--deep);background:var(--pale);padding:8px 12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.side{display:grid;gap:14px}
.mascot{display:grid;place-items:center;padding:18px 0 26px}
.mascot img{width:200px;height:auto;filter:drop-shadow(0 6px 0 rgba(20,40,70,.5))}
.find{padding:0 0 16px}
.label{display:inline-block;background:var(--steel);color:#fff;font-family:var(--f-pix);font-weight:700;font-size:16px;letter-spacing:.18em;padding:8px 14px;text-shadow:2px 2px 0 var(--deep)}
.find .in{padding:14px 16px 0;display:grid;gap:10px}
input[type=search]{font:500 17px var(--f-body);color:var(--deep);background:var(--ice);border:3px solid var(--deep);padding:10px 12px;width:100%;box-sizing:border-box;outline:none}
input[type=search]:focus-visible{box-shadow:0 0 0 3px var(--live)}
.hint{font-size:13px;color:var(--deep)}
.count{font-family:var(--f-pix);font-size:12px;letter-spacing:.14em;color:var(--deep)}
.board{padding:14px}
.tw{max-height:min(70vh,640px);overflow:auto;border:3px solid var(--deep)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--deep);color:#fff;font:700 15px var(--f-pix);letter-spacing:.12em;padding:12px 10px;text-align:center;z-index:1}
thead th.t{text-align:left}
td{padding:10px;text-align:center;font-size:18px;font-weight:600;color:var(--deep);border-bottom:1px solid var(--sky)}
td.t{text-align:left;font-weight:500}
tbody tr:nth-child(odd){background:var(--ice)}tbody tr:nth-child(even){background:var(--pale)}
td.r{font-family:var(--f-pix);font-weight:700;width:80px}
tr.top td.r{color:#fff;background:var(--mid)}
tr.top td{font-weight:700}
.empty{padding:28px;text-align:center;color:var(--deep);font-weight:500}
.owner{background:var(--deep);color:var(--ice);padding:14px 16px;display:grid;gap:10px;font-size:14px}
.owner b{font-family:var(--f-pix);letter-spacing:.14em;font-size:13px}
.owner .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.owner input{flex:1 1 260px;min-width:0;font:14px var(--f-body);padding:8px 10px;background:var(--ice);color:var(--deep);border:0}
.owner button{font:700 13px var(--f-pix);letter-spacing:.1em;background:var(--live);color:var(--deep);border:0;padding:9px 14px;cursor:pointer}
.owner button.ghost{background:transparent;color:var(--ice);border:2px solid var(--sky)}
.owner button:focus-visible{outline:3px solid #fff}
.msg{color:var(--pale)}.msg.bad{color:#FFC857}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.mascot{display:none}td{font-size:16px}td.r{width:56px}}
@media (max-width:520px){.board{padding:8px}thead th{font-size:10px;letter-spacing:0;padding:10px 3px}td{padding:8px 3px;font-size:15px}td.r{width:34px}.gain{display:none}h1{letter-spacing:.02em}.sub{font-size:11px;letter-spacing:.12em}}

header.blk{isolation:isolate}
.blk>canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
header.blk>div{z-index:1}
#burst{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.mv{display:inline-block;margin-left:6px;font:700 11px var(--f-pix);color:#0B7A3B}
.gain{display:inline-block;margin-left:8px;font:700 12px var(--f-pix);color:var(--deep);background:var(--live);padding:2px 6px;vertical-align:2px}
.scan{position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
@media (prefers-reduced-motion:no-preference){
 .dot{animation:pulse 1.6s ease-in-out infinite}
 @keyframes pulse{50%{box-shadow:0 0 2px var(--live),0 0 18px var(--live);transform:scale(.75)}}
 .mascot img{animation:bob 3.2s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1.5deg)}}
 .mascot::after{content:"";position:absolute;left:50%;bottom:18px;width:120px;height:12px;margin-left:-60px;background:rgba(34,57,90,.35);border-radius:50%;animation:shadow 3.2s ease-in-out infinite}
 @keyframes shadow{50%{transform:scaleX(.8);opacity:.6}}
 .blk::before{animation:sway 16s ease-in-out infinite alternate}
 @keyframes sway{to{transform:translate(22px,-14px) scale(1.05) rotate(.6deg)}}
 tbody.intro tr{animation:rowin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
 @keyframes rowin{from{transform:translateX(-18px);opacity:.3}}
 tr.top td{background-image:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);background-size:260% 100%;background-repeat:no-repeat;animation:shine 3.8s linear infinite}
 @keyframes shine{from{background-position:160% 0}to{background-position:-60% 0}}
 tr.up td{animation:flash 1.3s ease-out 3}
 @keyframes flash{25%{background-color:#B9FFD6}}
 .gain{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,fade 1s 8s forwards}
 @keyframes pop{from{transform:scale(0)}}
 @keyframes fade{to{opacity:0}}
 .mv{animation:hop .6s ease-in-out 4}
 @keyframes hop{50%{transform:translateY(-4px)}}
 .stamp.fresh{animation:stampin 1.4s ease-out}
 @keyframes stampin{0%{background:var(--live);transform:scale(1.1)}}
 .label{animation:blink 6s steps(1) infinite}
 @keyframes blink{0%,94%,100%{background:var(--steel)}96%{background:var(--mid)}}
 input[type=search]:focus{animation:caret .9s steps(1) infinite}
 @keyframes caret{50%{border-color:var(--steel)}}
}

.hright{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.brand{background:var(--deep);display:flex;align-items:center;gap:18px;padding:12px 20px;position:relative;overflow:hidden;box-shadow:6px 6px 0 rgba(20,40,70,.35)}
.brand small{position:absolute;top:5px;left:10px;font:700 9px var(--f-pix);letter-spacing:.2em;color:var(--sky)}
.brand img{display:block;width:auto;position:relative}
.brand .htu{height:62px}.brand .ieee{height:42px}
.brand .sep{width:6px;height:46px;background:repeating-linear-gradient(var(--sky) 0 6px,transparent 6px 12px);flex:none}
.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--deep);color:var(--ice);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;position:relative;overflow:hidden;box-shadow:6px 6px 0 rgba(20,40,70,.35)}
.tile .pl{grid-row:span 2;font:700 34px var(--f-pix);color:#fff;line-height:1;text-shadow:3px 3px 0 var(--steel)}
.tile .pl sup{font-size:13px;vertical-align:14px;margin-left:2px}
.tile .nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .more{font:12px var(--f-pix);letter-spacing:.1em;color:var(--sky)}
.tile .xp{grid-row:span 2;text-align:right;font:700 30px var(--f-pix);color:var(--live);line-height:1;font-variant-numeric:tabular-nums}
.tile .xp span{display:block;font-size:10px;letter-spacing:.2em;color:var(--sky);margin-top:4px}
.tile.first{background:linear-gradient(135deg,var(--deep),#1C4A57)}
.tile.first .pl{color:var(--live);text-shadow:3px 3px 0 #0E3B2A}
.tile.first{padding-top:22px}.crown{position:absolute;top:5px;left:17px;width:22px;height:14px;opacity:.9;
 background:linear-gradient(var(--live),var(--live)) 0 6px/22px 8px no-repeat,linear-gradient(var(--live),var(--live)) 0 0/4px 6px no-repeat,linear-gradient(var(--live),var(--live)) 9px 0/4px 6px no-repeat,linear-gradient(var(--live),var(--live)) 18px 0/4px 6px no-repeat}
.boardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toggle{font:700 12px var(--f-pix);letter-spacing:.12em;background:var(--deep);color:var(--ice);border:0;padding:8px 12px;cursor:pointer}
.toggle[aria-pressed=true]{background:var(--live);color:var(--deep)}
.toggle:focus-visible{outline:3px solid #fff}
.board{position:relative}
.ticker{background:var(--deep);overflow:hidden;white-space:nowrap;padding:10px 0;position:relative;box-shadow:6px 6px 0 rgba(20,40,70,.35)}
.ticker .lead{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;padding:0 14px;background:var(--live);color:var(--deep);font:700 12px var(--f-pix);letter-spacing:.14em}
.ticker .track{display:inline-block;padding-left:150px;font:600 16px var(--f-body);color:var(--ice)}
.ticker .it{margin:0 22px}.ticker .it b{font-family:var(--f-pix);color:var(--live);margin-left:6px}
.ticker .it i{font-style:normal;color:var(--sky);font-family:var(--f-pix);font-size:12px;margin-right:6px}
@media (max-width:820px){.tops{grid-template-columns:minmax(0,1fr)}.hright{align-items:flex-start}.brand .htu{height:48px}.brand .ieee{height:32px}}
@media (prefers-reduced-motion:no-preference){
 .brand img{animation:materialize 1.1s steps(8) both}
 .brand .ieee{animation-delay:.35s}
 @keyframes materialize{from{clip-path:inset(0 100% 0 0);filter:brightness(3)}to{clip-path:inset(0 0 0 0)}}
 .brand::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:300% 100%;animation:glint 5s ease-in-out 1.5s infinite;mix-blend-mode:overlay;pointer-events:none}
 @keyframes glint{0%{background-position:120% 0}40%,100%{background-position:-60% 0}}
 .tile{animation:tilein .6s cubic-bezier(.2,1.4,.4,1) both}
 .tile:nth-child(2){animation-delay:.12s}.tile:nth-child(3){animation-delay:.24s}
 @keyframes tilein{from{transform:translateY(16px) scale(.96)}}
 .tile.first{animation:tilein .6s cubic-bezier(.2,1.4,.4,1) both,glow 2.4s ease-in-out .6s infinite}
 @keyframes glow{50%{box-shadow:6px 6px 0 rgba(20,40,70,.35),0 0 0 3px var(--live),0 0 26px rgba(92,255,157,.45)}}
 .crown{animation:crown 1.8s ease-in-out infinite}
 @keyframes crown{50%{transform:translateY(-3px) rotate(-6deg)}}
 .tile.first .xp{animation:neon 2.4s ease-in-out infinite}
 @keyframes neon{50%{text-shadow:0 0 12px rgba(92,255,157,.8)}}
 .board::after{content:"";position:absolute;inset:5px;pointer-events:none;opacity:.7;
  background:linear-gradient(90deg,var(--live) 50%,transparent 0) 0 0/24px 3px repeat-x,linear-gradient(90deg,var(--live) 50%,transparent 0) 0 100%/24px 3px repeat-x,linear-gradient(0deg,var(--live) 50%,transparent 0) 0 0/3px 24px repeat-y,linear-gradient(0deg,var(--live) 50%,transparent 0) 100% 0/3px 24px repeat-y;
  animation:ants 1.2s linear infinite}
 @keyframes ants{to{background-position:24px 0,-24px 100%,0 -24px,100% 24px}}
 .ticker .track{animation:marquee var(--dur,60s) linear infinite}
 @keyframes marquee{to{transform:translateX(-50%)}}
 .ticker .lead{animation:blink2 1.2s steps(1) infinite}
 @keyframes blink2{50%{background:#B9FFD6}}
}

.host{display:flex;flex-direction:column;align-items:flex-end}
.htag{font:700 11px var(--f-pix);letter-spacing:.24em;color:#fff;background:var(--steel);padding:5px 10px;text-shadow:1px 1px 0 var(--deep)}
.brand{padding:18px 26px;gap:26px;color:#fff;background:linear-gradient(160deg,#25426A,var(--deep) 60%)}
.brand small{display:none}
.brand svg{display:block;width:auto;position:relative;z-index:1;overflow:visible}
.brand svg.htu{height:96px}.brand svg.ieee{height:62px}
.brand .sep{height:72px}
.pc{position:absolute;width:10px;height:10px;background:var(--live)}
.pc.tl{top:0;left:0}.pc.br{bottom:0;right:0}
@media (max-width:820px){.host{align-items:flex-start}.brand{padding:14px 18px;gap:18px}.brand svg.htu{height:64px}.brand svg.ieee{height:42px}.brand .sep{height:50px}}
@media (max-width:420px){.brand svg.htu{height:52px}.brand svg.ieee{height:34px}.brand{gap:12px;padding:12px 14px}}
@media (prefers-reduced-motion:no-preference){
 .brand svg{animation:materialize 1.1s steps(10) both,breathe 4s ease-in-out 1.6s infinite}
 .brand svg.ieee{animation-delay:.4s,2s}
 @keyframes breathe{50%{filter:drop-shadow(0 0 6px rgba(214,235,251,.55))}}
 .pc{animation:pcblink 1.4s steps(1) infinite}.pc.br{animation-delay:.7s}
 @keyframes pcblink{50%{opacity:.25}}
 .htag{animation:tagin .5s steps(5) both}
 @keyframes tagin{from{clip-path:inset(0 100% 0 0)}}
}
@media (prefers-reduced-motion:reduce){.scan{display:none}}

var q=document.getElementById('q'),tb=document.getElementById('tb'),empty=document.getElementById('empty');
var prevMap={},firstRender=true;

function render(){
 if(!DATA)return;
 var s=q.value.trim().toLowerCase();
 var rows=DATA.rows.filter(function(r){return !s||String(r[1]).toLowerCase().indexOf(s)>-1});
 tb.innerHTML=rows.map(function(r,i){var p=prevMap[r[1]],gain=p?r[2]-p[2]:0,mv=p&&typeof p[0]==='number'&&typeof r[0]==='number'?p[0]-r[0]:0;
  return '<tr class="'+(r[0]===1?'top ':'')+(gain>0?'up':'')+'" style="--i:'+Math.min(i,24)+'"><td class="r">'+esc(r[0])+(mv>0?'<span class="mv">▲'+mv+'</span>':'')+'</td><td class="t">'+esc(r[1])+(gain>0?'<span class="gain">+'+gain+' XP</span>':'')+'</td><td'+(gain>0?' data-from="'+p[2]+'" data-to="'+r[2]+'"':'')+'>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'}).join('');
 empty.hidden=rows.length>0;empty.textContent='No team matches that name.';
 document.getElementById('count').textContent=s?(rows.length+' OF '+DATA.rows.length+' TEAMS'):(DATA.rows.length+' TEAMS');
}
function countUp(){if(RM)return;tb.querySelectorAll('td[data-to]').forEach(function(td){var a=+td.dataset.from,b=+td.dataset.to,t0=performance.now();
 (function step(t){var k=Math.min(1,(t-t0)/1100);td.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0)})}

 if(fresh){el.classList.remove('fresh');void el.offsetWidth;el.classList.add('fresh')}}
function tops(){
 var ranks=[];DATA.rows.forEach(function(r){if(typeof r[0]==='number'&&ranks.indexOf(r[0])<0)ranks.push(r[0])});ranks.sort(function(a,b){return a-b});
 var sfx=function(n){var j=n%10,k=n%100;return (j===1&&k!==11)?'ST':(j===2&&k!==12)?'ND':(j===3&&k!==13)?'RD':'TH'};
 document.getElementById('tops').innerHTML=ranks.slice(0,3).map(function(rk,i){var t=DATA.rows.filter(function(r){return r[0]===rk});
  return '<div class="tile'+(i===0?' first':'')+'">'+(i===0?'<span class="crown" aria-hidden="true"></span>':'')+'<div class="pl">'+rk+'<sup>'+sfx(rk)+'</sup></div><div class="nm">'+t.slice(0,2).map(function(r){return esc(r[1])}).join(', ')+'</div><div class="xp">'+esc(t[0][2])+'<span>XP</span></div><div class="more">'+(t.length>2?'+'+(t.length-2)+' MORE TEAMS':t.length+(t.length>1?' TEAMS TIED':' TEAM'))+'</div></div>'}).join('');
}
function ticker(){var pos=DATA.rows.filter(function(r){return r[2]>0});if(!pos.length)pos=DATA.rows.slice(0,15);
 var one=pos.map(function(r){return '<span class="it"><i>#'+esc(r[0])+'</i>'+esc(r[1])+'<b>'+esc(r[2])+' XP</b></span>'}).join('');
 var tr=document.getElementById('track');tr.innerHTML=one+one;tr.style.setProperty('--dur',Math.max(25,pos.length*3.2)+'s');}

// pixel confetti
function burst(big){if(RM)return;var c=document.getElementById('burst'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 var cols=['#5CFF9D','#D6EBFB','#8BB8DD','#FFFFFF','#FFC857'],ps=[],n=big?220:90;
 for(var i=0;i<n;i++)ps.push({x:W*(big?Math.random():.5+(Math.random()-.5)*.4),y:big?-20-Math.random()*H*.5:H*.25,vx:(Math.random()-.5)*(big?2:9),vy:big?2+Math.random()*3:-4-Math.random()*6,s:4+Math.floor(Math.random()*3)*2,c:cols[i%cols.length]});
 var t0=performance.now();(function loop(t){var k=(t-t0)/1000;x.clearRect(0,0,W,H);ps.forEach(function(p){p.vy+=.12;p.x+=p.vx;p.y+=p.vy;x.globalAlpha=Math.max(0,1-k/4);x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});if(k<4)requestAnimationFrame(loop);else x.clearRect(0,0,W,H)})(t0);}

function apply(next){
 var sig=JSON.stringify(next.rows);
 if(DATA&&JSON.stringify(DATA.rows)===sig){DATA.updated=next.updated;stamp(false);return}
 var changed=!!DATA,newLeader=false;
 prevMap={};
 if(DATA){DATA.rows.forEach(function(r){prevMap[r[1]]=r});
  var top=function(d){return d.rows.filter(function(r){return r[0]===1}).map(function(r){return r[1]}).sort().join('|')};
  newLeader=top(DATA)!==top(next);}
 DATA=next;render();tops();ticker();stamp(changed);
 if(firstRender){firstRender=false;tb.classList.add('intro');setTimeout(function(){tb.classList.remove('intro')},2200)}
 if(changed){countUp();burst(newLeader);setTimeout(function(){prevMap={}},12000)}
}
function status(ok){document.getElementById('dot').className='dot'+(ok?'':' stale');
 document.getElementById('subtx').textContent=ok?'Live standings // search your team':'Reconnecting… // showing last scores';}
var busy=false;
function poll(){
 if(busy||document.hidden)return;busy=true;
 fetch(API_URL+(API_URL.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
 .then(function(d){if(!d||!Array.isArray(d.rows))throw new Error('bad data');status(true);apply(d)})
 .catch(function(){status(false);if(!DATA){empty.hidden=false;empty.textContent='Can’t reach the scores right now. Retrying…'}})
 .then(function(){busy=false});
}
q.addEventListener('input',render);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
if(API_URL.indexOf('script.google.com')<0){empty.textContent='Set API_URL in index.html to your Apps Script web app link.'}else{poll();setInterval(poll,POLL_MS)}

// header pixel motes
(function(){if(RM)return;var c=document.getElementById('fx'),x=c.getContext('2d'),ps=[],W,H,dpr=Math.min(2,window.devicePixelRatio||1);
 function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
 function spawn(){return{x:Math.random()*W,y:H+10,s:2+Math.floor(Math.random()*3)*2,v:.25+Math.random()*.6,a:.25+Math.random()*.5,c:Math.random()<.18?'#5CFF9D':'#D6EBFB'}}
 for(var i=0;i<34;i++){var p=spawn();p.y=Math.random()*H;ps.push(p)}
 (function loop(){x.clearRect(0,0,W,H);ps.forEach(function(p,i){p.y-=p.v;p.x+=Math.sin((p.y+i*40)/30)*.25;if(p.y<-10)ps[i]=spawn();x.globalAlpha=p.a;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});requestAnimationFrame(loop)})();})();

// auto-scroll for the big screen
(function(){var tw=document.getElementById('tw'),btn=document.getElementById('auto'),on=!RM,hold=0,pauseUntil=0,acc=0;
 function setBtn(){btn.setAttribute('aria-pressed',on);btn.textContent='AUTO-SCROLL '+(on?'ON':'OFF')}
 try{var k=localStorage.getItem('xp-lb-auto');if(k!==null)on=k==='1'}catch(e){}setBtn();
 btn.addEventListener('click',function(){on=!on;setBtn();try{localStorage.setItem('xp-lb-auto',on?'1':'0')}catch(e){}});
 ['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){tw.addEventListener(ev,function(){pauseUntil=performance.now()+10000},{passive:true})});
 var last=performance.now();
 (function loop(t){var dt=t-last;last=t;
  if(on&&!q.value&&t>pauseUntil&&!tw.matches(':hover')&&tw.scrollHeight>tw.clientHeight+4){
   if(hold>0){hold-=dt;if(hold<=0&&tw.scrollTop>=tw.scrollHeight-tw.clientHeight-2){tw.scrollTo({top:0,behavior:'smooth'});hold=2500}}
   else{acc+=dt*0.028;var st=Math.floor(acc);if(st){acc-=st;tw.scrollTop+=st}if(tw.scrollTop>=tw.scrollHeight-tw.clientHeight-2)hold=3000}}
  requestAnimationFrame(loop)})(last);})();
})();
</script>
