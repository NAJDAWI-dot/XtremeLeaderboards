.blk>*{position:relative}
header.blk{padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.title{background:var(--steel);padding:10px 18px;display:inline-block}
h1{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(26px,5.2vw,56px);letter-spacing:.06em;color:#fff;line-height:1;position:relative;text-shadow:4px 4px 0 var(--deep);white-space:nowrap}
h1 .g{position:absolute;left:0;top:0;text-shadow:none}
h1 .g1{color:#9BE7FF;clip-path:inset(18% 0 58% 0);transform:translateX(-5px);opacity:.9}
h1 .g2{color:#fff;clip-path:inset(64% 0 12% 0);transform:translateX(6px)}
@media (prefers-reduced-motion:no-preference){h1 .g1{animation:gl 4.5s steps(1) infinite}h1 .g2{animation:gl 4.5s steps(1) infinite reverse}}
@keyframes gl{0%,86%,100%{transform:translateX(0)}88%{transform:translateX(-6px)}92%{transform:translateX(5px)}96%{transform:translateX(-3px)}}
.sub{font-family:var(--f-pix);font-size:13px;letter-spacing:.22em;color:var(--steel);margin-top:10px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.dot{width:10px;height:10px;background:var(--live);box-shadow:0 0 8px var(--live);flex:none}
.dot.stale{background:#FFC857;box-shadow:0 0 8px #FFC857}
.stamp{font-family:var(--f-pix);font-size:14px;letter-spacing:.12em;color:var(--deep);background:var(--pale);padding:8px 12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.side{display:grid;gap:14px}
.mascot{display:grid;place-items:center;padding:18px 0 26px}
.mascot img{width:200px;height:auto;filter:drop-shadow(0 6px 0 rgba(20,40,70,.5))}
.find{padding:0 0 16px}

 var sfx=function(n){var j=n%10,k=n%100;return (j===1&&k!==11)?'ST':(j===2&&k!==12)?'ND':(j===3&&k!==13)?'RD':'TH'};
 document.getElementById('tops').innerHTML=ranks.slice(0,3).map(function(rk,i){var t=DATA.rows.filter(function(r){return r[0]===rk});
  return '<div class="tile'+(i===0?' first':'')+'">'+(i===0?'<span class="crown" aria-hidden="true"></span>':'')+'<div class="pl">'+rk+'<sup>'+sfx(rk)+'</sup></div><div class="nm">'+t.slice(0,2).map(function(r){return esc(r[1])}).join(', ')+'</div><div class="xp">'+esc(t[0][2])+'<span>XP</span></div><div class="more">'+(t.length>2?'+'+(t.length-2)+' MORE TEAMS':t.length+(t.length>1?' TEAMS TIED':' TEAM'))+'</div></div>'}).join('');
}
function ticker(){var pos=DATA.rows.filter(function(r){return r[2]>0});if(!pos.length)pos=DATA.rows.slice(0,15);
 var one=pos.map(function(r){return '<span class="it"><i>#'+esc(r[0])+'</i>'+esc(r[1])+'<b>'+esc(r[2])+' XP</b></span>'}).join('');
 var tr=document.getElementById('track');tr.innerHTML=one+one;tr.style.setProperty('--dur',Math.max(25,pos.length*3.2)+'s');}

// pixel confetti
function burst(big){if(RM)return;var c=document.getElementById('burst'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
 c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 var cols=['#5CFF9D','#D6EBFB','#8BB8DD','#FFFFFF','#FFC857'],ps=[],n=big?220:90;
 for(var i=0;i<n;i++)ps.push({x:W*(big?Math.random():.5+(Math.random()-.5)*.4),y:big?-20-Math.random()*H*.5:H*.25,vx:(Math.random()-.5)*(big?2:9),vy:big?2+Math.random()*3:-4-Math.random()*6,s:4+Math.floor(Math.random()*3)*2,c:cols[i%cols.length]});
 var t0=performance.now();(function loop(t){var k=(t-t0)/1000;x.clearRect(0,0,W,H);ps.forEach(function(p){p.vy+=.12;p.x+=p.vx;p.y+=p.vy;x.globalAlpha=Math.max(0,1-k/4);x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});if(k<4)requestAnimationFrame(loop);else x.clearRect(0,0,W,H)})(t0);}

function apply(next){
 var sig=JSON.stringify(next.rows);
 if(DATA&&JSON.stringify(DATA.rows)===sig){DATA.updated=next.updated;stamp(false);return}
 var changed=!!DATA,newLeader=false;
 prevMap={};
 if(DATA){DATA.rows.forEach(function(r){prevMap[r[1]]=r});
  var top=function(d){return d.rows.filter(function(r){return r[0]===1}).map(function(r){return r[1]}).sort().join('|')};
  newLeader=top(DATA)!==top(next);}
 DATA=next;render();tops();ticker();stamp(changed);
 if(firstRender){firstRender=false;tb.classList.add('intro');setTimeout(function(){tb.classList.remove('intro')},2200)}
 if(changed){countUp();burst(newLeader);setTimeout(function(){prevMap={}},12000)}
}
function status(ok){document.getElementById('dot').className='dot'+(ok?'':' stale');
 document.getElementById('subtx').textContent=ok?'Live standings // search your team':'Reconnecting… // showing last scores';}
var busy=false;
function poll(){
 if(busy||document.hidden)return;busy=true;
 fetch(API_URL+(API_URL.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
 .then(function(d){if(!d||!Array.isArray(d.rows))throw new Error('bad data');status(true);apply(d)})
 .catch(function(){status(false);if(!DATA){empty.hidden=false;empty.textContent='Can’t reach the scores right now. Retrying…'}})
 .then(function(){busy=false});
}
q.addEventListener('input',render);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
if(API_URL.indexOf('script.google.com')<0){empty.textContent='Set API_URL in the SETTINGS block at the top of this file.'}else{poll();setInterval(poll,POLL_MS)}

// header pixel motes
(function(){if(RM)return;var c=document.getElementById('fx'),x=c.getContext('2d'),ps=[],W,H,dpr=Math.min(2,window.devicePixelRatio||1);
 function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
 function spawn(){return{x:Math.random()*W,y:H+10,s:2+Math.floor(Math.random()*3)*2,v:.25+Math.random()*.6,a:.25+Math.random()*.5,c:Math.random()<.18?'#5CFF9D':'#D6EBFB'}}
 for(var i=0;i<34;i++){var p=spawn();p.y=Math.random()*H;ps.push(p)}
 (function loop(){x.clearRect(0,0,W,H);ps.forEach(function(p,i){p.y-=p.v;p.x+=Math.sin((p.y+i*40)/30)*.25;if(p.y<-10)ps[i]=spawn();x.globalAlpha=p.a;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});requestAnimationFrame(loop)})();})();

// auto-scroll for the big screen
(function(){var tw=document.getElementById('tw'),btn=document.getElementById('auto'),on=!RM,hold=0,pauseUntil=0,acc=0;
 function setBtn(){btn.setAttribute('aria-pressed',on);btn.textContent='AUTO-SCROLL '+(on?'ON':'OFF')}
 try{var k=localStorage.getItem('xp-lb-auto');if(k!==null)on=k==='1'}catch(e){}setBtn();
 btn.addEventListener('click',function(){on=!on;setBtn();try{localStorage.setItem('xp-lb-auto',on?'1':'0')}catch(e){}});
 ['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){tw.addEventListener(ev,function(){pauseUntil=performance.now()+10000},{passive:true})});
 var last=performance.now();
 (function loop(t){var dt=t-last;last=t;
  if(on&&!q.value&&t>pauseUntil&&!tw.matches(':hover')&&tw.scrollHeight>tw.clientHeight+4){
   if(hold>0){hold-=dt;if(hold<=0&&tw.scrollTop>=tw.scrollHeight-tw.clientHeight-2){tw.scrollTo({top:0,behavior:'smooth'});hold=2500}}
   else{acc+=dt*0.028;var st=Math.floor(acc);if(st){acc-=st;tw.scrollTop+=st}if(tw.scrollTop>=tw.scrollHeight-tw.clientHeight-2)hold=3000}}
  requestAnimationFrame(loop)})(last);})();
})();
</script>
